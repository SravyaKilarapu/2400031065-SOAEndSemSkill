spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      routes:
        - id: ride-service-route
          uri: lb://RIDE-SERVICE
          predicates:
            - Path=/rides/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
